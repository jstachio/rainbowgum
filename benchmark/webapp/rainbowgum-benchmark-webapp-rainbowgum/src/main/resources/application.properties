server.port=8080
# logging.file.name is intentionally not set here: RainbowGum's LogOutputRegistry.normalize()
# only correctly resolves a relative path when it is prefixed with "./" (anything else - a
# bare filename, or even an absolute path - is misread as a URI scheme, a RainbowGum quirk
# rather than a Spring one), so run.sh passes -Dlogging.file.name=./benchmark.log instead.
# It (and FILE_LOG_PATTERN, also -D-only for RainbowGum - see run.sh) are the two properties
# where this app's config differs from the other two.
