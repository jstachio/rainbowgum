name: Build with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: "${{github.run_number}}"
      # -T1: opt back out of the -T2C default in .mvn/maven.config for CI.
      # Maven only backs off and retries 429 and 503 by default; Central also
      # returns 502 now and then.
      MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode --no-transfer-progress -T1 -Daether.transport.http.retryHandler.serviceUnavailable=429,500,502,503,504"

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 27
        uses: actions/setup-java@v5
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: 'maven'
          # Keyed per workflow: each builds different modules, and a shared key is
          # saved by whichever job finishes first.
          cache-dependency-path: |
            **/pom.xml
            **/.mvn/extensions.xml
            **/.mvn/wrapper/maven-wrapper.properties
            .github/workflows/maven.yml
      - name: Build and Test with Maven
        run: ./mvnw $MAVEN_CLI_OPTS clean verify
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/target/surefire-reports/TEST-*.xml'
      # Coverage is self-hosted: no external service in the CI path. The HTML report is
      # published with the snapshot docs by apidoc.yml and attached to every run here.
      - name: Coverage summary
        if: always() && hashFiles('rainbowgum-coverage-aggregate/target/site/jacoco-aggregate/jacoco.xml') != ''
        run: >
          java bin/src/main/java/io/jstach/script/CoverageReport.java
          rainbowgum-coverage-aggregate/target/site/jacoco-aggregate/jacoco.xml
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('rainbowgum-coverage-aggregate/target/site/jacoco-aggregate/jacoco.xml') != ''
        with:
          name: coverage-report
          path: rainbowgum-coverage-aggregate/target/site/jacoco-aggregate
