name: 'Test Report'
on:
  workflow_run:
    workflows: ['Build with Maven']
    types:
      - completed

# Downloads the test-results artifact from the Build with Maven run and
# publishes it as a check run.
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
    - uses: dorny/test-reporter@v1
      with:
        artifact: test-results
        name: Maven Surefire Tests
        path: '**/target/surefire-reports/TEST-*.xml'
        reporter: java-junit