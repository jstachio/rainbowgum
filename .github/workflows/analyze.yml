name: Analyze

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:

    strategy:
      matrix:
        profile: ['checkerframework', 'errorprone', 'nullaway']

    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: "${{github.run_number}}"
      # -T1: opt back out of the -T2C default in .mvn/maven.config for CI.
      MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode --no-transfer-progress -T1"

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install maven modules
        run: ./mvnw $MAVEN_CLI_OPTS install -Dmaven.javadoc.skip -DskipTests -Dmaven.source.skip=true
      - name: Analyze with ${{ matrix.profile }}
        run: bin/analyze.sh ${{ matrix.profile }} 
