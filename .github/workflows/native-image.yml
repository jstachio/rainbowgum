name: Native Image Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Minimal starting point recommended by GitHub's own Actions security review:
# this workflow only checks out code and builds/tests, it never needs to write
# anything back to the repository.
permissions:
  contents: read

jobs:
  native-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}
    env:
      # Maven only backs off and retries 429 and 503 by default; Central also
      # returns 502 now and then.
      MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode --no-transfer-progress -T1 -Daether.transport.http.retryHandler.serviceUnavailable=429,500,502,503,504"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Maven cache
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          # Keyed per workflow: each builds different modules, and a shared key is
          # saved by whichever job finishes first.
          cache-dependency-path: |
            **/pom.xml
            **/.mvn/extensions.xml
            **/.mvn/wrapper/maven-wrapper.properties
            .github/workflows/native-image.yml
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          # Deliberately tracks the latest GraalVM release rather than this project's own
          # JDK 21 bytecode baseline: people who reach for GraalVM native-image are more
          # likely to already be on the latest GraalVM, so that is what gets tested here.
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Rainbow Gum
        run: ./mvnw $MAVEN_CLI_OPTS -DskipTests clean install
      - name: Build and run rainbowgum-test-native as a native image
        run: ./mvnw $MAVEN_CLI_OPTS -f test/rainbowgum-test-native/pom.xml -Pnative verify
