# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set up JDK 27
        uses: actions/setup-java@v5
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: 'maven'
      - name: mvn install
        # -T1: opt back out of the -T2C default in .mvn/maven.config for CI.
        # Tests run (unlike the release doc build) only to produce the coverage report;
        # a failing test must not stop the snapshot docs from publishing.
        run: >
          ./mvnw --batch-mode --no-transfer-progress -T1 -Pdoc -Dcodecover=true
          -Dmaven.test.failure.ignore=true clean install
      - name: Add coverage report
        if: hashFiles('rainbowgum-coverage-aggregate/target/site/jacoco-aggregate/jacoco.xml') != ''
        run: |
          cp -r rainbowgum-coverage-aggregate/target/site/jacoco-aggregate target/reports/apidocs/coverage
          java bin/src/main/java/io/jstach/script/CoverageReport.java \
            target/reports/apidocs/coverage/jacoco.xml \
            --badge target/reports/apidocs/coverage/badge.svg \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: 'target/reports/apidocs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
