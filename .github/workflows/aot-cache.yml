name: JDK AOT Cache Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Minimal starting point recommended by GitHub's own Actions security review
# (raised on the sibling native-image workflow, PR #528): this workflow only
# checks out code and builds/tests, it never needs to write anything back to
# the repository.
permissions:
  contents: read

jobs:
  aot-cache-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}
    env:
      MAVEN_CLI_OPTS: "-s .m2/settings.xml --batch-mode --no-transfer-progress -T1"

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 27
        uses: actions/setup-java@v5
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install Rainbow Gum
        run: ./mvnw $MAVEN_CLI_OPTS -DskipTests clean install
      - name: Build the JDK AOT cache and run against it
        run: ./mvnw $MAVEN_CLI_OPTS -f test/rainbowgum-test-aot-cache/pom.xml -Paot verify
