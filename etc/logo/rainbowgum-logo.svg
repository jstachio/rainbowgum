<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 480" width="1024" height="515" role="img" aria-label="Rainbow Gum">
  <title>Rainbow Gum</title>

  <style>
    svg {
      /* canopy: foliage */
      --green: limegreen;
      --vein: green;

      /* canopy: coffee beans, three roasts */
      --bean-light: #8c5e3c;  --bean-light-edge: #56391f;
      --bean-mid:   #6f4e37;  --bean-mid-edge:   #443021;
      --bean-dark:  #4a2c17;  --bean-dark-edge:  #2e1b0e;

      /* trunk: bark, one colour per strand (green renamed from --green) */
      --bark-green: #3fae5a;
      --teal: #22a0a8;
      --blue: #2f7fd1;
      --violet: #6b5bd6;
      --magenta: #c0479a;
      --orange: #e35a3a;
      --gold: #f0a92c;
    }

    /* canopy */
    #canopy use { stroke-width: 3; }
    .leaf       { fill: var(--green);      stroke: var(--vein); }
    .bean-light { fill: var(--bean-light); stroke: var(--bean-light-edge); }
    .bean-mid   { fill: var(--bean-mid);   stroke: var(--bean-mid-edge); }
    .bean-dark  { fill: var(--bean-dark);  stroke: var(--bean-dark-edge); }

    /* trunk */
    #trunk use { stroke-width: 24; stroke-linecap: butt; }
    .green   { stroke: var(--bark-green); }
    .teal    { stroke: var(--teal); }
    .blue    { stroke: var(--blue); }
    .violet  { stroke: var(--violet); }
    .magenta { stroke: var(--magenta); }
    .orange  { stroke: var(--orange); }
    .gold    { stroke: var(--gold); }
    
    #letter-r  { fill : var(--magenta); } 
    #letter-a  { fill : var(--violet); }
    #letter-i  { fill : var(--blue); }
    #letter-n  { fill : var(--teal); }
    #letter-b  { fill : var(--bark-green); }
    #letter-o  { fill : var(--gold); }
    #letter-w  { fill : var(--orange); }
    
    #letter-g  { fill : var(--magenta); } 
    #letter-u  { fill : var(--violet); }
    #letter-m  { fill : var(--blue); }
    #rainbowgum-text { stroke: var(--green); }
  </style>

  <defs>
    <!-- canopy: one leaf, lying flat; the <use> rotates it -->
    <g id="leaf">
      <ellipse rx="35" ry="17"/>
      <path d="M-30 0 H30" fill="none"/>
    </g>

    <!-- trunk: the single diagonal every stripe is a copy of -->
    <line id="stripe" x1="-30" y1="420" x2="150" y2="330"/>

    <!-- trunk: square off its rectangle before it's moved into place -->
    <clipPath id="edges">
      <rect x="0" y="0" width="120" height="355"/>
    </clipPath>
  </defs>

  <g id="trunk" clip-path="url(#edges)" transform="translate(160,115)">
    <use href="#stripe" class="green"/>
    <use href="#stripe" class="teal" transform="translate(0,-22)"/>
    <use href="#stripe" class="blue" transform="translate(0,-44)"/>
    <use href="#stripe" class="violet" transform="translate(0,-66)"/>
    <use href="#stripe" class="magenta" transform="translate(0,-88)"/>
    <use href="#stripe" class="orange" transform="translate(0,-110)"/>
    <use href="#stripe" class="gold" transform="translate(0,-132)"/>
    <use href="#stripe" class="green" transform="translate(0,-154)"/>
    <use href="#stripe" class="teal" transform="translate(0,-176)"/>
    <use href="#stripe" class="blue" transform="translate(0,-198)"/>
    <use href="#stripe" class="violet" transform="translate(0,-220)"/>
    <use href="#stripe" class="magenta" transform="translate(0,-242)"/>
    <use href="#stripe" class="orange" transform="translate(0,-264)"/>
    <use href="#stripe" class="gold" transform="translate(0,-286)"/>
    <use href="#stripe" class="green" transform="translate(0,-308)"/>
    <use href="#stripe" class="teal" transform="translate(0,-330)"/>
    <use href="#stripe" class="blue" transform="translate(0,-352)"/>
    <use href="#stripe" class="violet" transform="translate(0,-374)"/>
    <use href="#stripe" class="magenta" transform="translate(0,-396)"/>
    <use href="#stripe" class="orange" transform="translate(0,-418)"/>
    <use href="#stripe" class="gold" transform="translate(0,-440)"/>
    <use href="#stripe" class="green" transform="translate(0,-462)"/>
    <use href="#stripe" class="teal" transform="translate(0,-484)"/>
    <use href="#stripe" class="blue" transform="translate(0,-506)"/>
    <use href="#stripe" class="violet" transform="translate(0,-528)"/>
  </g>

  <g id="canopy">
    <!-- row 1 -->
    <use href="#leaf" class="leaf" transform="translate(37,46) rotate(-45)"/>
    <use href="#leaf" class="bean-dark" transform="translate(73,46) rotate(45)"/>
    <use href="#leaf" class="leaf" transform="translate(109,46) rotate(-45)"/>
