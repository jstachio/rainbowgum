# Rainbow Gum's own property format, loaded from the classpath by rainbowgum-simple-props.

logging.level=INFO
logging.level.rainbowgum.weblog.example=DEBUG

# The console as usual, plus the web output that WebLogConfigurator registers. It pushes
# to the log feed and serves a page that follows it.
logging.appenders=console,web
logging.appender.console.output.uri=stdout
logging.appender.console.encoder.uri=ttll

# Listen on localhost only. Use 0.0.0.0 to reach the page from other machines, behind a
# firewall: there is no login.
logging.appender.web.output.uri=web://127.0.0.1:8080/
logging.appender.web.encoder.uri=ttll

# How many entries the feed keeps for a page that connects.
logging.feed.size=500
