# Rainbow Gum's own property format, loaded from the classpath by rainbowgum-simple-props.
# Every key could also be set as a system property (-Dlogging.level=DEBUG) or an
# environment variable (RAINBOWGUM_level=DEBUG), which take precedence over this file.

# Root level, and a more verbose level for this example's own package.
logging.level=INFO
logging.level.rainbowgum.simpleprops.example=DEBUG

# One console appender using the TTLL format.
logging.appenders=console
logging.appender.console.output=stdout
logging.appender.console.encoder=ttll

# TTLL options for the console appender's encoder.
logging.encoder.ttll.console.level=bracketed
logging.encoder.ttll.console.logger=short
